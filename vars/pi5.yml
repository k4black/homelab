username: "k4black"
device_name: "pi5"
ssh_port: "{{ pi5_ssh_port }}"
password: "{{ bws.pi5_password }}"
ssh_public_key_file: "~/.ssh/id_ed25519.pub"
# TODO: fix, now auto resolved to default ipv4 address
# pi5_local_ipv4 is defined in vars/all.yml

storage_disk_uuid: "9c4a1efe-c4e5-47cc-a4da-8edc199c410a"

services_configs_dir: /srv/configs
services_data_dir: /srv/data

# Build context for the locally-built headless-anki image (see anki service in
# files/pi5/docker-compose.yml.j2). Upstream repo is cloned here and our patched
# Dockerfile.pi5 is dropped in.
anki_build_dir: /srv/build/headless-anki

# Prowlarr indexer wishlist. `name` must match the exact entry in Prowlarr's
# /api/v1/indexer/schema response (the playbook task does case-sensitive match
# and silently skips on mismatch). Mechanically each entry is cloned from the
# schema, has overrides applied, POSTed with enable=false (skips Test), then
# PUT with enable=true&forceSave=true (PUT genuinely bypasses Test — POST does
# not, even with forceSave). cf_protected: true tags the indexer with the
# flaresolverr tag so Prowlarr routes its requests through FlareSolverr.
prowlarr_indexers:
  # Public, no auth
  - {name: "The Pirate Bay"}
  - {name: "YTS"}
  - {name: "Internet Archive"}
  # Public but CloudFlare-protected — route through FlareSolverr
  - {name: "1337x", cf_protected: true}
  - {name: "kickasstorrents.to", cf_protected: true}
  # Private — credentials from BWS
  - name: "RuTracker.org"
    fields:
      username: "{{ bws.pi5_rutracker_username }}"
      password: "{{ bws.pi5_rutracker_password }}"


packages_install_list:
  # dev
  - git
  - git-lfs
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  # web
  - wget
  - curl
  - dnsutils
  # utils
  - exfat-fuse
  - zsh
  - cron
  - unzip
  - htop
  - nano
  # resolvconf not needed — systemd-resolved handles DNS
  - net-tools
