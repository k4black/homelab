---
# Values written as `{{ bws.<name> }}` come from Bitwarden Secrets Manager
# (tasks/bws_load.yml). Never put a secret or a private identifier here as plain text.

full_name: "Konstantin Chernyshev"
email: "{{ bws.personal_email }}"
default_username: "k4black"

git_email: "38007247+k4black@users.noreply.github.com"


timezone: Europe/Berlin


### any docker subnets: 10.2.x.x
# vps docker: any ip in the 10.2.1.X subnet
vps_docker_network_subnet: 10.2.1.0/24
vps_docker_network_gateway: 10.2.1.1
vps_docker_network_pihole_ip: 10.2.1.53
# pi5 docker: any ip in the 10.2.2.X subnet
pi5_docker_network_subnet: 10.2.2.0/24
pi5_docker_network_gateway: 10.2.2.1
pi5_docker_network_pihole_ip: 10.2.2.53

router_local_ipv4: 192.168.1.1
pi5_local_ipv4: 192.168.1.100
pi5_ssh_port: 4221


# metrics
netdata_stream_api_key: "{{ bws.netdata_stream_api_key }}"


domain: "{{ bws.base_domain }}"


# cloudflare
cloudflare_api_token: "{{ bws.cloudflare_api_token }}"

# domains
vps_duckdns_subdomain: "{{ bws.vps_duckdns_subdomain }}"
pi5_duckdns_subdomain: "{{ bws.pi5_duckdns_subdomain }}"
# Tailnet IPs (admin console -> Machines). Hosts run tailscale with
# --accept-dns=false, so MagicDNS names do not resolve there. An empty BWS value
# (the vps until it rejoins) drops that host from the generated DNS and routes.
pi5_tailscale_ipv4: "{{ bws.pi5_tailscale_ipv4 }}"
vps_tailscale_ipv4: "{{ bws.vps_tailscale_ipv4 }}"
duckdns_token: "{{ bws.duckdns_token }}"

# ── Host table ─────────────────────────────────────────────────────────────
# Every server host. Service names are svc.<name>.<domain>. Generates, on every
# host: the Traefik forward routes to the other hosts, both DNS views
# (files/shared/tailnet-dns.conf.j2, files/*/pihole-02-custom-dns.conf.j2), the
# Homepage docker sources and the public DNS records (vps cloudflare-ddns).
# `homelab_host` in vars/<host>.yml names the current host.
homelab_hosts:
  - {name: pi5, tailscale_ipv4: "{{ pi5_tailscale_ipv4 }}"}
  - {name: vps, tailscale_ipv4: "{{ vps_tailscale_ipv4 }}"}

# Any client on the tailnet or a docker bridge sees no login (Authelia bypass);
# everyone else comes through the public door on the vps and logs in.
trusted_networks:
  - 100.64.0.0/10
  - 10.0.0.0/8


foundry_username: "{{ bws.foundry_username }}"
foundry_password: "{{ bws.foundry_password }}"
foundry_admin_password: "{{ bws.foundry_admin_password }}"


# ── Hermes Agent (Nous Research) ──────────────────────────────────────────
# Kept in the shared vars (not pi5-only) so the gateway can move to / be added
# on another node later. Telegram is reachable outside the VPN, so the allowlist
# (numeric user IDs from @userinfobot) is the only access control on the bot —
# which has shell access in its container.
hermes_telegram_allowed_users: "{{ bws.hermes_telegram_allowed_users }}"
hermes_openrouter_api_key: "{{ bws.hermes_openrouter_api_key }}"
hermes_telegram_bot_token: "{{ bws.hermes_telegram_bot_token }}"


# Todoist personal API token (Settings -> Integrations -> Developer). Used to
# give Hermes Todoist capability (see the anki/skills setup in pi5). Shared var
# so it can be reused across nodes.
todoist_api_token: "{{ bws.todoist_api_token }}"

# Hermes dashboard auth. Since hermes-agent v2026.9.24 (June-2026 hardening,
# PR #50476) a non-loopback dashboard bind always requires an auth provider:
# HERMES_DASHBOARD_INSECURE is a warned no-op, so the dashboard fails closed
# without these. Username is plain; password + signing secret come from BWS.
hermes_dashboard_username: "k4black"
hermes_dashboard_password: "{{ bws.hermes_dashboard_password }}"
hermes_dashboard_auth_secret: "{{ bws.hermes_dashboard_auth_secret }}"

# Tailscale: nodes join with a one-off, preauthorized auth key that the playbook
# mints at deploy time from an OAuth client (auth_keys scope only, owning the
# tags). The OAuth secret therefore never reaches the hosts — they only ever hold
# a spent key. Tagged nodes have key expiry disabled by default, and TS_AUTH_ONCE
# means the credential is used for the first login only (state lives in
# TS_STATE_DIR). `tailscale_tag` is per host: tag:server (vars/pi5.yml, vars/vps.yml)
# or tag:router (vars/router.yml). The policy (files/tailscale-policy.hujson.j2)
# auto-approves the exit nodes and the routers' subnet routes.
tailscale_image: "tailscale/tailscale:v1.102.5"
tailscale_extra_args: "--accept-dns=false --advertise-exit-node"
tailscale_oauth_client_id: "{{ bws.tailscale_oauth_client_id }}"
tailscale_oauth_client_secret: "{{ bws.tailscale_oauth_client_secret }}"
# Second client, policy_file scope only, used by playbook_tailscale_policy.yml.
tailscale_policy_oauth_client_id: "{{ bws.tailscale_policy_oauth_client_id }}"
tailscale_policy_oauth_client_secret: "{{ bws.tailscale_policy_oauth_client_secret }}"
tailscale_tailnet_name: "{{ bws.tailscale_tailnet_name }}"

# ── Authelia (vps): the single login for the public door ───────────────────
# File users (argon2id hashes) and OIDC clients. See README "Auth".
authelia_url: "https://auth.vps.{{ domain }}"
authelia_jwt_secret: "{{ bws.authelia_jwt_secret }}"
authelia_session_secret: "{{ bws.authelia_session_secret }}"
authelia_storage_encryption_key: "{{ bws.authelia_storage_encryption_key }}"
authelia_oidc_hmac_secret: "{{ bws.authelia_oidc_hmac_secret }}"
authelia_oidc_jwks_key: "{{ bws.authelia_oidc_jwks_key }}"
# JSON list: [{"username", "displayname", "email", "password": "<argon2id hash>", "groups": ["admins"]}]
authelia_users: "{{ bws.authelia_users | from_json }}"
# OIDC clients: plaintext secret for the app, pbkdf2 digest for Authelia.
authelia_oidc_jellyfin_secret: "{{ bws.authelia_oidc_jellyfin_secret }}"
authelia_oidc_jellyfin_secret_hash: "{{ bws.authelia_oidc_jellyfin_secret_hash }}"
authelia_oidc_homeassistant_secret: "{{ bws.authelia_oidc_homeassistant_secret }}"
authelia_oidc_homeassistant_secret_hash: "{{ bws.authelia_oidc_homeassistant_secret_hash }}"
