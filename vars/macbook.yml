# error when installed this way, include in homebrew_installed_packages
dockutil_install: true
configure_dock: true
# DOCK: mirrors the live dock of k4pro-m3 (macOS 27). Slack exists only with the
# work profile, so items carry a `profile` (`all` or a profile name) and
# playbook_macbook.yml selects + numbers them in list order. Positions are not
# hardcoded: dockutil --position needs a contiguous 1..N sequence, and dropping
# Slack from the personal profile would leave a hole.
# macOS 26/27 renames: Launchpad -> Apps (/System/Applications/Apps.app),
# Mail/Calendar moved under /System/Applications, Zen Browser -> Zen.app.
dockitems_remove:
  - TV
  - Podcasts
  - "App Store"
  - Safari
  - Siri
  - FaceTime
  - Contacts
  - Maps
  - Messages
  - News
  - Music
  - Photos
  - Freeform
  - Keynote
  - Numbers
  - Pages
dockitems_persist_layout:
  # NOTE: Finder is always first (pos 0, added by macOS itself)
  - {name: "Apps", path: "/System/Applications/Apps.app", profile: all}
  - {name: "Mail", path: "/System/Applications/Mail.app", profile: all}
  - {name: "Calendar", path: "/System/Applications/Calendar.app", profile: all}
  - {name: "Todoist", path: "/Applications/Todoist.app", profile: all}
  - {name: "Obsidian", path: "/Applications/Obsidian.app", profile: all}
  - {name: "Slack", path: "/Applications/Slack.app", profile: work}
  - {name: "System Settings", path: "/System/Applications/System Settings.app", profile: all}
  - {name: "Zen", path: "/Applications/Zen.app", profile: all}
  - {name: "Telegram Desktop", path: "/Applications/Telegram Desktop.app", profile: all}
  - {name: "Terminal", path: "/System/Applications/Utilities/Terminal.app", profile: all}
  - {name: "Activity Monitor", path: "/System/Applications/Utilities/Activity Monitor.app", profile: all}


