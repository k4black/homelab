username: "k4black"
# device_name: must be provided via -e device_name=...

# Profile: "personal" (default) or "work" (override with -e macbook_profile=work)
macbook_profile: "personal"

# Feature flags driven by profile
# Admin juggling (separate admin user + sudoers) is disabled for now.
macbook_setup_admin_juggling: false

# Bitwarden desktop (App Store build) SSH agent socket. Enable it in Bitwarden
# Settings -> "Enable SSH agent". k4black/.dotfiles points ssh at the same path.
bitwarden_ssh_agent_sock: "{{ ansible_env.HOME }}/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock"

# ~/Projects working-tree layout (mirrors the local Mac structure).
macbook_projects_subdirs:
  - opensource
  - personal
  - work


homebrew_cask_appdir: /Applications
homebrew_cask_apps_common:
  # web and social
  - zen
  - telegram-desktop
  - ungoogled-chromium
  # dev
  - zed
  - docker-desktop
  - sublime-text
  - jetbrains-toolbox
  - cursor
  - claude
  - claude-code
  # fun
  # - autodesk-fusion  # not installed; Fusion needs a manual seat + driver setup
  - anki
  - steam
  - freecad
  - flutter
  # utils
  - google-drive
  - the-unarchiver
  - lulu
  - basictex
  - monitorcontrol  # TODO: add permissions to Accessibility and login item
  # creative
  - affinity
  # - inkscape  # superseded by affinity (removed from the machine)
  # - gimp  # superseded by affinity (removed from the machine)
  # 3d printing
  # - prusaslicer  # not installed; Original Prusa Drivers must be installed manually
  # mix
  - todoist-app
  - obsidian
  - zotero
  - chatgpt
  - notion
  # fonts
  - font-inter
  - font-roboto
  - font-roboto-condensed
  - font-roboto-mono
  - font-roboto-slab
  - font-jetbrains-mono
# Profile-specific cask apps
homebrew_cask_apps_extra:
  personal:
    - tunnelblick
  work:
    - slack
homebrew_cask_apps: "{{ homebrew_cask_apps_common + homebrew_cask_apps_extra[macbook_profile] }}"
homebrew_installed_packages_common:
  # dev
  - git
  - git-lfs
  - sqlite
  - dockutil
  - gh
  - npm
  - ripgrep
  # languages
  - pyenv
  - go
  - rustup
  - openjdk
  # utils
  - grpcurl
  - tree
  # ssh
  - ssh-copy-id
  - openssl
# Profile-specific formulae
homebrew_installed_packages_extra:
  personal: []
  work:
    - azure-cli
homebrew_installed_packages: "{{ homebrew_installed_packages_common + homebrew_installed_packages_extra[macbook_profile] }}"
# homebrew/cask-fonts was deprecated; font casks are now in homebrew/cask
homebrew_taps: []

# error when installed this way, include in homebrew_installed_packages
dockutil_install: true
configure_dock: true
# DOCK: mirrors the live dock of k4pro-m3 (macOS 27). Slack exists only with the
# work profile, so items carry a `profile` (`all` or a profile name) and
# playbook_macbook.yml selects + numbers them in list order. Positions are not
# hardcoded: dockutil --position needs a contiguous 1..N sequence, and dropping
# Slack from the personal profile would leave a hole.
# macOS 26/27 renames: Launchpad -> Apps (/System/Applications/Apps.app),
# Mail/Calendar moved under /System/Applications, Zen Browser -> Zen.app.
dockitems_remove:
  - TV
  - Podcasts
  - "App Store"
  - Safari
  - Siri
  - FaceTime
  - Contacts
  - Maps
  - Messages
  - News
  - Music
  - Photos
  - Freeform
  - Keynote
  - Numbers
  - Pages
dockitems_persist_layout:
  # NOTE: Finder is always first (pos 0, added by macOS itself)
  - {name: "Apps", path: "/System/Applications/Apps.app", profile: all}
  - {name: "Mail", path: "/System/Applications/Mail.app", profile: all}
  - {name: "Calendar", path: "/System/Applications/Calendar.app", profile: all}
  - {name: "Todoist", path: "/Applications/Todoist.app", profile: all}
  - {name: "Obsidian", path: "/Applications/Obsidian.app", profile: all}
  - {name: "Slack", path: "/Applications/Slack.app", profile: work}
  - {name: "System Settings", path: "/System/Applications/System Settings.app", profile: all}
  - {name: "Zen", path: "/Applications/Zen.app", profile: all}
  - {name: "Telegram Desktop", path: "/Applications/Telegram Desktop.app", profile: all}
  - {name: "Terminal", path: "/System/Applications/Utilities/Terminal.app", profile: all}
  - {name: "Activity Monitor", path: "/System/Applications/Utilities/Activity Monitor.app", profile: all}


mas_installed_apps:
  - {id: 1352778147, name: "Bitwarden"}  # also the SSH agent, see bitwarden_ssh_agent_sock
  - {id: 1444383602, name: "Goodnotes 6"}
  - {id: 1423210932, name: "Flow"}
# required admin permissions
mas_uninstalled_apps: []
