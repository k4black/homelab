---
# Mints a one-off, tagged Tailscale key with tasks/tailscale_create_key.yml and
# exposes it to the compose template as `tailscale_node_authkey` (empty when the
# node is already authenticated and tagged). The OAuth client secret stays in the
# vault and never reaches a host.
#
# Runs before the containers_setup role.

- name: Read the current Tailscale node state
  ansible.builtin.command: docker exec tailscale tailscale status --json
  register: tailscale_node_status
  become: true
  changed_when: false
  failed_when: false

- name: Read the node state and tags
  when: tailscale_node_status.rc == 0
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ ((tailscale_node_status.stdout | from_json) or {}).get('BackendState') or 'unknown' }}
    tailscale_current_tags: >-
      {{ ((tailscale_node_status.stdout | from_json).Self or {}).get('Tags') or [] }}

# rc 0 alone does not prove the node is logged in — a container that is up but logged
# out still answers with JSON — so the backend state is part of the decision.
- name: Decide whether a key is needed
  ansible.builtin.set_fact:
    tailscale_needs_key: >-
      {{ tailscale_node_status.rc != 0
         or (tailscale_backend_state | default('unknown')) != 'Running'
         or tailscale_tag not in (tailscale_current_tags | default([])) }}

- name: Mint and adopt a tagged node key
  when: tailscale_needs_key | bool
  block:
    - name: Mint the key
      ansible.builtin.include_tasks: tasks/tailscale_create_key.yml

    # A node that is already authenticated keeps its user-owned identity: with
    # TS_AUTH_ONCE the container will not log in again by itself, so an existing
    # node is converted in place. The minted key is consumed here.
    - name: Convert the existing node to {{ tailscale_tag }}
      when: tailscale_node_status.rc == 0
      ansible.builtin.command: >-
        docker exec tailscale tailscale up
        --auth-key={{ tailscale_minted_key }}
        --advertise-tags={{ tailscale_tag }}
        {{ tailscale_extra_args }}
        --force-reauth
        --reset
      become: true
      no_log: true
      changed_when: true

    - name: Hand the key to the compose template for a fresh node
      ansible.builtin.set_fact:
        tailscale_node_authkey: "{{ tailscale_minted_key if tailscale_node_status.rc != 0 else '' }}"
      no_log: true
