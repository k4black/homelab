---

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
    autoremove: true
  become: true
  changed_when: false
  when: packages_install_update_cache

- name: Install packages
  ansible.builtin.apt:
    name: "{{ packages_install_list }}"
    state: present
  become: true
