---
# k4black/.agents is the single source of truth for AI-agent content (skills,
# global rules, harness wiring). This role installs every agent CLI and the tools
# install.sh needs; install.sh only verifies they exist (fails on a missing one),
# then wires skills, rules, plugins, MCP servers and harness config.

# SSH so the user's key auto-authenticates pulls (re-runs) and manual pushes.
# CI overrides this with the public HTTPS URL (see .github/workflows/test.yml).
agents_setup_repo: "git@github.com:k4black/.agents.git"
agents_setup_dest: "{{ ansible_env.HOME }}/Projects/personal/.agents"
agents_setup_version: "main"

# claude/claude-code are casks in vars/macbook.yml (geerlingguy.mac.homebrew role);
# dart comes with the flutter cask there.
# hex (k4black/hex) is intentionally absent until hex-cli is published to a
# registry — there is no tap/formula yet, only `cargo install --git` from main.
agents_setup_brew_casks:
  - codex  # OpenAI Codex CLI (installs a `codex` binary, not a .app)
agents_setup_brew_formulae:
  - jq               # install.sh merges JSON settings with it
  - opencode         # terminal AI coding agent
  - pi-coding-agent  # pi agent harness
