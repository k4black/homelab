---

- name: Install Zsh
  ansible.builtin.apt:
    name: zsh
    state: present
  become: true

- name: Setup Zsh as login shell
  when: zsh_setup_set_default_shell
  block:
    - name: Check if Zsh is the login shell
      ansible.builtin.command: grep "{{ zsh_setup_user }}.*zsh$" /etc/passwd
      register: zsh_setup_zsh_login_shell
      ignore_errors: true
      changed_when: false
    - name: Set Zsh as the login shell
      ansible.builtin.command: chsh -s /bin/zsh "{{ zsh_setup_user }}"
      when: not zsh_setup_zsh_login_shell.stdout
      changed_when: false
