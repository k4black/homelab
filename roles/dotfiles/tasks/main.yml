- name: Run dotfiles setup scripts
  # Skipped in CI (testing=true): .macos.sh mutates the runner's user defaults and
  # is the dotfiles repo's own concern, while the playbook's job in CI is to prove
  # the role converges.
  when:
    - dotfiles_run_scripts is defined
    - testing is undefined or testing != 'true'
  ansible.builtin.command: "{{ item }}"
  with_items: "{{ dotfiles_run_scripts }}"
  args:
    chdir: "{{ dotfiles_dest }}"
  become: false
  changed_when: false

- name: Run dotfiles system setup scripts
  ansible.builtin.command: "{{ item }}"
  loop: "{{ dotfiles_system_scripts | default([]) }}"
  when: testing is undefined or testing != 'true'
  become: true
  changed_when: false
