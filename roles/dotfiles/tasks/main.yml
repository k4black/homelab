- name: Check for a local dotfiles repository
  ansible.builtin.stat:
    path: "{{ dotfiles_dest }}/.git"
  register: dotfiles_git_directory

- name: Check for local dotfiles changes
  ansible.builtin.command:
    argv: [git, status, --porcelain]
    chdir: "{{ dotfiles_dest }}"
  register: dotfiles_local_changes
  changed_when: false
  check_mode: false
  when: dotfiles_git_directory.stat.exists

- name: Clone or update dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo_url }}"
    dest: "{{ dotfiles_dest }}"
    version: main
    force: false
    update: "{{ dotfiles_local_changes.stdout | default('') | length == 0 }}"
    depth: 1
    accept_newhostkey: true
    ssh_opts: >-
      -o IdentityAgent={{ bitwarden_ssh_agent_sock | quote }}

- name: Symlink dotfiles
  ansible.builtin.file:
    src: "{{ dotfiles_dest }}/{{ item.key }}"
    dest: "{{ item.value }}"
    state: link
    force: "{{ dotfiles_overwrite_if_exists }}"
  with_dict: "{{ dotfiles_symlinks }}"
  register: dotfiles_symlink_result

- name: Make .localrc empty file
  ansible.builtin.file:
    path: "~/.localrc"
    state: touch
    mode: "0600"
    owner: "{{ ansible_facts['user_id'] }}"
  changed_when: false

- name: Make empty .gitconfig.local file
  ansible.builtin.file:
    path: "~/.gitconfig.local"
    state: touch
    mode: "0600"
    owner: "{{ ansible_facts['user_id'] }}"
  changed_when: false

