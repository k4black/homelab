name: "Test playbooks"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * 2"  # semi-random time once a week

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# TODO: the BWS token reads the whole `homelab` project. Give test jobs dummy vars
# and move the Tailscale check to its own `ci` project.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.12
          cache: 'pip' # caching pip dependencies

      - name: Install python and ansible requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint

  # One macOS runner instead of a per-profile matrix: the profile-specific
  # differences are asserted on a cheap ubuntu runner (check-macbook-profiles),
  # and the shared install path is exercised here once.
  test-macbook-playbook:
    runs-on: macos-latest
    # Nobody approves the `bws` environment for the weekly cron run.
    if: github.event_name != 'schedule'
    environment: bws
    env:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Uninstall GitHub Actions' built-in Homebrew
        run: sudo /bin/bash tests/uninstall-homebrew.sh

      - name: Uninstall GitHub Actions' built-in browser installs
        run: |
          ls -lah /Applications
          sudo rm -rf /Applications/Firefox.app
          sudo rm -rf /Applications/Google\ Chrome.app
          sudo rm -rf /usr/local/bin/firefox
          sudo rm -rf /usr/local/bin/chromedriver

      - name: Install python and ansible requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Test the playbook's syntax
        run: ansible-playbook playbook_macbook.yml -i inventory-test.ini -e "device_name=test-mac" -e "macbook_profile=personal" --syntax-check

      - name: Test the playbook (personal)
        run: ansible-playbook playbook_macbook.yml -i inventory-test.ini -e "testing=true" -e "device_name=test-mac" -e "macbook_profile=personal" -e "admin_password=admin_password user_account_password=" -e "dotfiles_repo_url=https://github.com/k4black/.dotfiles.git" -e "agents_setup_repo=https://github.com/k4black/.agents.git" --skip-tags "mas"
        env:
          ANSIBLE_FORCE_COLOR: '1'

      - name: Idempotence check (personal)
        run: |
          idempotence=$(mktemp)
          ansible-playbook playbook_macbook.yml -i inventory-test.ini -e "testing=true" -e "device_name=test-mac" -e "macbook_profile=personal" -e "admin_password=admin_password user_account_password=" -e "dotfiles_repo_url=https://github.com/k4black/.dotfiles.git" -e "agents_setup_repo=https://github.com/k4black/.agents.git" --skip-tags "mas,dock" | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: '1'

  check-macbook-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install python and ansible requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Syntax check both profiles
        run: |
          for profile in personal work; do
            ansible-playbook playbook_macbook.yml -i inventory-test.ini -e "device_name=test-mac" -e "macbook_profile=$profile" --syntax-check
          done

      - name: Assert the profile-specific lists
        run: |
          for profile in personal work; do
            ansible-playbook playbook_macbook_profile_check.yml -i inventory-test.ini -e "macbook_profile=$profile"
          done

  check-tailscale-credential:
    runs-on: ubuntu-latest
    # Nobody approves the `bws` environment for the weekly cron run.
    if: github.event_name != 'schedule'
    environment: bws
    env:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install python and ansible requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Mint an ephemeral key and join a throwaway node
        run: ansible-playbook playbook_tailscale_check.yml -i localhost, -c local
        env:
          ANSIBLE_FORCE_COLOR: '1'

  test-vps-playbook:
    runs-on: ubuntu-latest
    # Nobody approves the `bws` environment for the weekly cron run.
    if: github.event_name != 'schedule'
    environment: bws
    env:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install python and ansible requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Test the playbook's syntax
        run: ansible-playbook playbook_vps.yml -i inventory-test.ini --syntax-check

      - name: Test the playbook
        run: ansible-playbook playbook_vps.yml -i inventory-test.ini -e "testing=true" --skip-tags "run_docker"
        env:
          ANSIBLE_FORCE_COLOR: '1'

      - name: Idempotence check
        run: |
          idempotence=$(mktemp)
          ansible-playbook playbook_vps.yml -i inventory-test.ini -e "testing=true" --skip-tags "run_docker" | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: '1'

  test-pi5-playbook:
    runs-on: ubuntu-latest
    # Nobody approves the `bws` environment for the weekly cron run.
    if: github.event_name != 'schedule'
    environment: bws
    env:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install python and ansible requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Test the playbook's syntax
        run: ansible-playbook playbook_pi5.yml -i inventory-test.ini --syntax-check

      - name: Test the playbook
        run: ansible-playbook playbook_pi5.yml -i inventory-test.ini -e "testing=true" --skip-tags "run_docker"
        env:
          ANSIBLE_FORCE_COLOR: '1'

      - name: Idempotence check
        run: |
          idempotence=$(mktemp)
          ansible-playbook playbook_pi5.yml -i inventory-test.ini -e "testing=true" --skip-tags "run_docker" | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: '1'

