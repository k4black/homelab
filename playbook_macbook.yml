---
- name: Configure MacOS device.
  hosts: localhost
  connection: local

  vars_files:
    - vars/all.yml
    - vars/macbook.yml

  pre_tasks:
    - name: Load secrets from Bitwarden Secrets Manager
      ansible.builtin.import_tasks: tasks/bws_load.yml
      tags: [always]
    - name: Assert device_name is provided
      ansible.builtin.assert:
        that: device_name is defined
        msg: "device_name must be provided via -e device_name=..."
    - name: Macos Admin Juggling
      ansible.builtin.include_tasks: tasks/macos_admin_juggling.yml
      when: macbook_setup_admin_juggling | bool and (testing is undefined or testing != 'true')
    # Dock items are profile-scoped (Slack ships only with the work profile), so
    # the position cannot live in vars: select for this profile, then number in
    # order. dockutil --position needs a contiguous 1..N sequence.
    - name: Select dock items for profile {{ macbook_profile }}
      tags: [dock]
      ansible.builtin.set_fact:
        macbook_dock_items: >-
          {{ dockitems_persist_layout | selectattr('profile', 'in', ['all', macbook_profile]) | list }}
    - name: Assign dock positions
      tags: [dock]
      ansible.builtin.set_fact:
        dockitems_persist: "{{ dockitems_persist | default([]) + [item | combine({'pos': idx + 1})] }}"
      loop: "{{ macbook_dock_items }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"
    - name: Create .ssh directory at ~/
      ansible.builtin.file:
        path: "~/.ssh"
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: "0700"
      become: false
    - name: Check ~/.ssh/config before the dotfiles role links it
      ansible.builtin.stat:
        path: ~/.ssh/config
      register: macbook_ssh_config
      become: false
    - name: Keep a copy of a hand-made ~/.ssh/config
      ansible.builtin.copy:
        src: ~/.ssh/config
        dest: ~/.ssh/config.pre-dotfiles
        remote_src: true
        force: false
        mode: "0600"
      when: macbook_ssh_config.stat.isreg | default(false)
      become: false
    - name: Ensure homebrew is in PATH
      ansible.builtin.stat:
        path: /opt/homebrew/bin/brew
      register: _homebrew_check

  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags: ["homebrew"]
      vars:
        # homebrew_upgrade_all_packages: true
        homebrew_cask_accept_external_apps: true
    - role: geerlingguy.mac.mas
      when: mas_installed_apps or mas_uninstalled_apps
      tags: ["mas"]
    - role: geerlingguy.mac.dock
      tags: ["dock"]
    - role: dotfiles
      tags: ["dotfiles"]
      vars:
        # SSH so the user's key auto-authenticates pulls (re-runs) and manual pushes.
        # CI overrides this with the public HTTPS URL (see .github/workflows/test.yml).
        dotfiles_repo_url: "git@github.com:k4black/.dotfiles.git"
        dotfiles_dest: "/Users/{{ ansible_user_id }}/Projects/personal/.dotfiles"
        dotfiles_symlinks:
          .zshrc: "/Users/{{ ansible_user_id }}/.zshrc"
          .gitconfig: "/Users/{{ ansible_user_id }}/.gitconfig"
          ssh_config: "/Users/{{ ansible_user_id }}/.ssh/config"
        dotfiles_run_scripts:
          - "/Users/{{ ansible_user_id }}/Projects/personal/.dotfiles/.macos.sh"
    - role: zsh_setup
      vars:
        zsh_setup_set_default_shell: true
        zsh_setup_user: "{{ ansible_user_id }}"
    # Installs the agent CLIs and runs k4black/.agents install.sh, which wires
    # skills, rules, plugins and harness config into every harness.
    - role: agents_setup
      tags: ["agents"]

  tasks:
    - name: Setup hostname
      ansible.builtin.hostname:
        name: "{{ device_name }}"
        use: "macos"
      become: true

    - name: Create ~/Projects structure (opensource / personal / work)
      ansible.builtin.file:
        path: "/Users/{{ ansible_user_id }}/Projects/{{ item }}"
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: "0755"
      loop: "{{ macbook_projects_subdirs }}"
    - name: Link ~/.dotfiles to the clone in ~/Projects/personal
      ansible.builtin.file:
        src: "/Users/{{ ansible_user_id }}/Projects/personal/.dotfiles"
        dest: "/Users/{{ ansible_user_id }}/.dotfiles"
        state: link
    - name: Create Applications directory at ~/
      ansible.builtin.file:
        path: "~/Applications"
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: "0755"
    - name: Remove the ssh-agent line from localrc (it would hide the Bitwarden agent)
      ansible.builtin.lineinfile:
        path: ~/.localrc
        line: 'eval "$(ssh-agent -s)"'
        state: absent
      become: false
    - name: Add brew to path in localrc
      ansible.builtin.lineinfile:
        path: ~/.localrc
        line: 'export PATH="/opt/homebrew/bin:$PATH"'
        state: present
        create: true
        mode: "0600"
        insertafter: EOF
      become: true

    # ~/.ssh/config itself comes from k4black/.dotfiles (Host * defaults, the
    # Bitwarden IdentityAgent, `Include config.d/*`). This repo owns the homelab
    # hosts, whose names come from BWS.
    - name: Create ~/.ssh/config.d
      ansible.builtin.file:
        path: ~/.ssh/config.d
        state: directory
        mode: "0700"
      become: false
    - name: Write homelab SSH hosts
      ansible.builtin.template:
        src: files/macbook/ssh-config-homelab.j2
        dest: ~/.ssh/config.d/homelab
        mode: "0600"
      become: false

    # Bitwarden's SSH agent holds the private keys. Git signing and the server
    # playbooks read ~/.ssh/<key>.pub, so write each agent key whose comment
    # (= the Bitwarden item name) starts with `id_` and has no .pub file yet.
    - name: List keys in the Bitwarden SSH agent
      ansible.builtin.command: ssh-add -L
      environment:
        SSH_AUTH_SOCK: "{{ bitwarden_ssh_agent_sock }}"
      register: macbook_agent_keys
      changed_when: false
      failed_when: false
      when: testing is undefined or testing != 'true'
      become: false
    - name: Write .pub files from the agent
      ansible.builtin.copy:
        content: "{{ item }}\n"
        dest: "~/.ssh/{{ item.split(' ')[2] }}.pub"
        mode: "0644"
        force: false
      loop: "{{ macbook_agent_keys.stdout_lines | default([]) | select('search', ' id_') | list }}"
      loop_control:
        label: "{{ item.split(' ')[2] }}"
      become: false

    - name: Setup .gitconfig.local
      ansible.builtin.template:
        src: files/.gitconfig.local.j2
        dest: ~/.gitconfig.local
        mode: "0600"
        owner: "{{ ansible_user_id }}"

    - name: Setup MonitorControl
      when: not 'monitorcontrol' in homebrew_cask_apps
      block:
        - name: Install MonitorControl
          community.general.homebrew:
            name: monitorcontrol
            state: present
    #        - name: Enable MonitorControl in System Preferences -> Privacy & Security -> Privacy -> Accessibility
    #          ansible.builtin.command: osascript -e 'tell application "System Events" to tell process "System Preferences"
    #  to tell window "Security & Privacy" to tell scroll area "Privacy" to tell table 1 to tell row 1 to tell checkbox 1 to if value is 0 then click'
    #          become: true

    # App Nap suspends background apps on macOS, which stops Anki-Connect
    # from responding while another window is in the foreground.
    # See: https://foosoft.net/projects/anki-connect/ (Notes for MacOS Users)
    - name: Disable App Nap for Anki (keeps Anki-Connect responsive in background)
      community.general.osx_defaults:
        domain: "{{ item }}"
        key: NSAppSleepDisabled
        type: bool
        value: true
        state: present
      loop:
        - net.ankiweb.dtop
        - net.ichi2.anki
        - org.qt-project.Qt.QtWebEngineCore

    - name: Set Default browser
      block:
        - name: Check if Zen Browser is installed
          ansible.builtin.stat:
            path: /Applications/Zen Browser.app
          register: zen_browser_app

        - name: Install defaultbrowser
          community.general.homebrew:
            name: defaultbrowser
            state: present
          when: zen_browser_app.stat.exists

        - name: Set Zen Browser as default browser
          ansible.builtin.command: osascript files/macbook/setDefaultBrowser.scpt com.zen.browser
          when: zen_browser_app.stat.exists
          changed_when: false
          become: true
